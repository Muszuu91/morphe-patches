name: Cast V2 build artifact

on:
  push:
    branches:
      - dev
      - feature/secondary-cast-v2
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3
      - name: Build patch bundle
        run: |
          mkdir -p reports
          set -o pipefail
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace 2>&1 | tee reports/cast-build.log
      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: patches/build/libs/*.mpp
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cast-v2-build-diagnostics-${{ github.run_id }}
          path: |
            reports/cast-build.log
            ~/.gradle/daemon/**/*.out.log
          if-no-files-found: warn
          retention-days: 14
