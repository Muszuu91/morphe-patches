name: Cast V2 build artifact

on:
  push:
    branches:
      - feature/cast-v2-standalone-build
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3
      - name: Build patch bundle
        run: ./gradlew :patches:buildAndroid --no-daemon --stacktrace
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: patches/build/libs/*.mpp
